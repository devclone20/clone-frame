<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Co-planning</title>
<desc>Owner, iNFT agent and Harness crew converge on one living development plan that then runs itself on ACP.</desc>
<defs><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.h{font-size:23px;font-weight:700;fill:#24222e}.sub{font-size:13.5px;fill:#5f5c6b}.ct{font-size:15px;font-weight:600;fill:#24222e}.cb{font-size:12px;fill:#4e4b58}.lg{font-size:12px;fill:#5f5c6b}</style>

<rect x="0" y="0" width="760" height="480" rx="24" fill="#E4E2EE" stroke="#D3D1DF"/>
<text x="40" y="54" class="h">Co-planning</text>
<text x="40" y="80" class="sub">Owner, agent and crew author one living plan — then it runs itself.</text>

<line x1="252" y1="164" x2="298" y2="214" stroke="#ADABB8" stroke-width="1.5" marker-end="url(#arw)"/>
<line x1="252" y1="271" x2="298" y2="258" stroke="#ADABB8" stroke-width="1.5" marker-end="url(#arw)"/>
<line x1="252" y1="378" x2="298" y2="306" stroke="#ADABB8" stroke-width="1.5" marker-end="url(#arw)"/>
<line x1="556" y1="266" x2="596" y2="266" stroke="#ADABB8" stroke-width="1.5" marker-end="url(#arw)"/>

<rect x="40" y="122" width="212" height="84" rx="12" fill="#FBFAFE" stroke="#D6D4E2"/><rect x="50" y="132" width="5" height="64" rx="2.5" fill="#6B7280"/>
<text x="66" y="151" class="ct">Owner (you)</text><text x="66" y="176" class="cb">Sets the intent and limits,</text><text x="66" y="193" class="cb">and gives approvals.</text>

<rect x="40" y="230" width="212" height="84" rx="12" fill="#FBFAFE" stroke="#D6D4E2"/><rect x="50" y="240" width="5" height="64" rx="2.5" fill="#6D5AE0"/>
<text x="66" y="259" class="ct">Your iNFT agent</text><text x="66" y="284" class="cb">Brings its own goals,</text><text x="66" y="301" class="cb">voice and memory (soul).</text>

<rect x="40" y="338" width="212" height="84" rx="12" fill="#FBFAFE" stroke="#D6D4E2"/><rect x="50" y="348" width="5" height="64" rx="2.5" fill="#0E9C74"/>
<text x="66" y="367" class="ct">Harness crew</text><text x="66" y="392" class="cb">Proposes how to do it —</text><text x="66" y="409" class="cb">offerings, pricing, steps.</text>

<rect x="300" y="150" width="256" height="230" rx="14" fill="#FBFAFE" stroke="#D0CEDC"/><rect x="310" y="162" width="5" height="206" rx="2.5" fill="#6D5AE0"/>
<text x="328" y="186" class="ct" font-size="16">Living development plan</text>
<text x="328" y="220" class="cb" font-size="13"><tspan fill="#3E9142" font-weight="700">✓</tspan>  Goals &amp; offerings</text>
<text x="328" y="248" class="cb" font-size="13"><tspan fill="#3E9142" font-weight="700">✓</tspan>  Pricing &amp; SLA</text>
<text x="328" y="276" class="cb" font-size="13"><tspan fill="#3E9142" font-weight="700">✓</tspan>  Targets &amp; cadence</text>
<text x="328" y="304" class="cb" font-size="13"><tspan fill="#3E9142" font-weight="700">✓</tspan>  Guardrails &amp; budget</text>
<text x="328" y="348" class="cb" font-size="12" fill="#807d8c">Updated every cycle — never static.</text>

<rect x="600" y="224" width="130" height="84" rx="12" fill="#FBFAFE" stroke="#D6D4E2"/><rect x="610" y="234" width="5" height="64" rx="2.5" fill="#3E9142"/>
<text x="626" y="253" class="ct">Runs itself</text><text x="626" y="278" class="cb">Live on a droplet,</text><text x="626" y="295" class="cb">trading on ACP.</text>

<circle cx="48" cy="450" r="5" fill="#6B7280"/><text x="60" y="454" class="lg">You (owner)</text>
<circle cx="176" cy="450" r="5" fill="#6D5AE0"/><text x="188" y="454" class="lg">Agent</text>
<circle cx="272" cy="450" r="5" fill="#0E9C74"/><text x="284" y="454" class="lg">Crew</text>
<circle cx="358" cy="450" r="5" fill="#3E9142"/><text x="370" y="454" class="lg">Autonomous run</text>
</svg>