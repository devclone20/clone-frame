<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 432" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img">
<title>LAYER FRAME — pipeline de layering</title>
<desc>LAYER FRAME: a partir de uma imagem-fonte, separa em camadas (fundo e traits), define pesos de raridade por trait e exporta um ZIP pronto a selar.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#57606e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="431" rx="14" fill="#0b0e14" stroke="#1b2230"/>
<circle cx="44" cy="29" r="4" fill="#2bb88a"/>
<text x="56" y="33" fill="#eaf0f7" font-size="14" font-weight="600">LAYER FRAME — image layering</text>
<rect x="210" y="56" width="260" height="56" rx="10" fill="#161b24" stroke="#38414f"/>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" fill="#d3dae4" font-size="14" font-weight="600">Source image</text>
<text x="340" y="96" text-anchor="middle" dominant-baseline="central" fill="#8a94a6" font-size="12">PNG · art</text>
<rect x="210" y="156" width="260" height="56" rx="10" fill="#1e1b37" stroke="#6a5fd0"/>
<text x="340" y="178" text-anchor="middle" dominant-baseline="central" fill="#cfc8ff" font-size="14" font-weight="600">Split layers</text>
<text x="340" y="196" text-anchor="middle" dominant-baseline="central" fill="#9890c8" font-size="12">background · traits</text>
<rect x="210" y="256" width="260" height="56" rx="10" fill="#1e1b37" stroke="#6a5fd0"/>
<text x="340" y="278" text-anchor="middle" dominant-baseline="central" fill="#cfc8ff" font-size="14" font-weight="600">Set rarity</text>
<text x="340" y="296" text-anchor="middle" dominant-baseline="central" fill="#9890c8" font-size="12">weights per trait</text>
<rect x="210" y="356" width="260" height="56" rx="10" fill="#1e1b37" stroke="#6a5fd0"/>
<text x="340" y="378" text-anchor="middle" dominant-baseline="central" fill="#cfc8ff" font-size="14" font-weight="600">Export</text>
<text x="340" y="396" text-anchor="middle" dominant-baseline="central" fill="#9890c8" font-size="12">ZIP · ready to seal</text>
<line x1="340" y1="112" x2="340" y2="148" stroke="#57606e" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="340" y1="212" x2="340" y2="248" stroke="#57606e" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="340" y1="312" x2="340" y2="348" stroke="#57606e" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
