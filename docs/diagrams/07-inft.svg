<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img">
<title>iNFT — anatomia do token</title>
<desc>O iNFT (agente de IA + NFT, self-custody) combina três standards: ERC-721A para posse, ERC-2981 para 5% de royalty e ERC-6551 para token-bound account. O tokenURI aponta para a Irys, onde vivem a arte e a metadata permanentes.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#57606e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="315" rx="14" fill="#0b0e14" stroke="#1b2230"/>
<circle cx="44" cy="29" r="4" fill="#2bb88a"/>
<text x="56" y="33" fill="#eaf0f7" font-size="14" font-weight="600">iNFT — what's in the token</text>
<rect x="40" y="50" width="600" height="150" rx="16" fill="none" stroke="#c06a40" stroke-width="1" stroke-dasharray="5 4" opacity="0.8"/>
<text x="56" y="76" fill="#eaf0f7" font-size="14" font-weight="600">iNFT</text>
<text x="56" y="92" fill="#8b95a7" font-size="12">agent + NFT · self-custody</text>
<rect x="64" y="104" width="168" height="86" rx="10" fill="#321f18" stroke="#c06a40"/>
<text x="148" y="140" text-anchor="middle" dominant-baseline="central" fill="#f0cbb8" font-size="14" font-weight="600">ERC-721A</text>
<text x="148" y="160" text-anchor="middle" dominant-baseline="central" fill="#c2937a" font-size="12">ownership</text>
<rect x="256" y="104" width="168" height="86" rx="10" fill="#321f18" stroke="#c06a40"/>
<text x="340" y="140" text-anchor="middle" dominant-baseline="central" fill="#f0cbb8" font-size="14" font-weight="600">ERC-2981</text>
<text x="340" y="160" text-anchor="middle" dominant-baseline="central" fill="#c2937a" font-size="12">5% royalty</text>
<rect x="448" y="104" width="168" height="86" rx="10" fill="#321f18" stroke="#c06a40"/>
<text x="532" y="140" text-anchor="middle" dominant-baseline="central" fill="#f0cbb8" font-size="14" font-weight="600">ERC-6551</text>
<text x="532" y="160" text-anchor="middle" dominant-baseline="central" fill="#c2937a" font-size="12">token-bound account</text>
<rect x="190" y="240" width="300" height="56" rx="10" fill="#161b24" stroke="#38414f"/>
<text x="340" y="262" text-anchor="middle" dominant-baseline="central" fill="#d3dae4" font-size="14" font-weight="600">Irys (tokenURI)</text>
<text x="340" y="280" text-anchor="middle" dominant-baseline="central" fill="#8a94a6" font-size="12">art + metadata, permanent</text>
<line x1="340" y1="200" x2="340" y2="234" stroke="#57606e" stroke-width="1.5" marker-end="url(#ar)"/><text x="350" y="222" fill="#8b95a7" font-size="12">tokenURI</text>
</svg>
