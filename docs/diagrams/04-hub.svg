<line x1="268" y1="188" x2="268" y2="204" stroke="#57606e" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="412" y1="188" x2="412" y2="204" stroke="#57606e" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="556" y1="188" x2="556" y2="204" stroke="#57606e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="64" y="210" width="120" height="56" rx="10" fill="#112e27" stroke="#1f7d5e"/>
<text x="124" y="232" text-anchor="middle" dominant-baseline="central" fill="#b8ecd8" font-size="14" font-weight="600">Train</text>
<text x="124" y="250" text-anchor="middle" dominant-baseline="central" fill="#6fb89f" font-size="12">soul + skills</text>
