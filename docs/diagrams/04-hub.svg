<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 306" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img">
<title>HUB — workstation</title>
<desc>O HUB é a workstation onde fazes deploy de skills (compradas no Plaza) ao teu agente iNFT e o operas: treinar, configurar, correr e monitorizar.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#57606e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="305" rx="14" fill="#0b0e14" stroke="#1b2230"/>
<circle cx="44" cy="29" r="4" fill="#2bb88a"/>
<text x="56" y="33" fill="#eaf0f7" font-size="14" font-weight="600">HUB — workstation</text>
<text x="56" y="52" fill="#8b95a7" font-size="12">deploy skills to your iNFT agent, then operate it</text>
<rect x="40" y="66" width="600" height="220" rx="14" fill="none" stroke="#1f7d5e" stroke-width="1" stroke-dasharray="5 4" opacity="0.8"/>
<rect x="80" y="92" width="190" height="56" rx="10" fill="#112e27" stroke="#1f7d5e"/>
<text x="175" y="114" text-anchor="middle" dominant-baseline="central" fill="#b8ecd8" font-size="14" font-weight="600">Skill</text>
<text x="175" y="132" text-anchor="middle" dominant-baseline="central" fill="#6fb89f" font-size="12">bought in Plaza</text>
