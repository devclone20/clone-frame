<text x="268" y="250" text-anchor="middle" dominant-baseline="central" fill="#6fb89f" font-size="12">skill settings</text>
<rect x="352" y="210" width="120" height="56" rx="10" fill="#112e27" stroke="#1f7d5e"/>
<text x="412" y="232" text-anchor="middle" dominant-baseline="central" fill="#b8ecd8" font-size="14" font-weight="600">Run</text>
<text x="412" y="250" text-anchor="middle" dominant-baseline="central" fill="#6fb89f" font-size="12">tasks · ACP</text>
