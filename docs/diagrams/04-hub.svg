<text x="505" y="114" text-anchor="middle" dominant-baseline="central" fill="#f0cbb8" font-size="14" font-weight="600">Your iNFT agent</text>
<text x="505" y="132" text-anchor="middle" dominant-baseline="central" fill="#c2937a" font-size="12">yours · self-custody</text>
<text x="340" y="112" text-anchor="middle" fill="#8b95a7" font-size="12">deploy</text>
<line x1="270" y1="120" x2="402" y2="120" stroke="#57606e" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="505" y1="148" x2="505" y2="188" stroke="#57606e" stroke-width="1.5"/>
<line x1="124" y1="188" x2="556" y2="188" stroke="#57606e" stroke-width="1.5"/>
<text x="64" y="183" fill="#8b95a7" font-size="12">operate</text>
