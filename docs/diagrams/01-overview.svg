<title>CLONE FRAME — mapa do sistema</title>
<desc>O CLONE FRAME HUB é uma app local, open-source (MIT): uma janela de ficheiro único + o daemon HUB Bridge em 127.0.0.1. A iIrys FRAME é a ferramenta aberta que autoria a alma e sela arte + metadata na Irys. Tudo assenta na infraestrutura partilhada: Base 8453, Irys, Virtuals — e na máquina do próprio dono.</desc>
