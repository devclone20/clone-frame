<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" role="img" aria-label="CLONE FRAME repository map">
  <defs>
    <linearGradient id="accentline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="560" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1097" height="557" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="552" width="1100" height="4" fill="url(#accentline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>
  <g fill="none" stroke="#ff3b30" stroke-linejoin="round">
    <path d="M104 32 111 18 118 32 Z" stroke-width="2"/>
    <path d="M108.2 29.5 111 23.9 113.8 29.5 Z" stroke-width="1.4"/>
  </g>
  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">what lives in the monorepo — five directories, nothing copied in</text>

  <rect x="40" y="66" width="1020" height="52" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="40" y="80" width="3" height="24" fill="#ff3b30"/>
  <text x="64" y="97" font-size="14" font-weight="700" fill="#ff3b30">site/</text>
  <text x="200" y="97" font-size="12.5" fill="#c9d1d9">cloneframe.html is canonical — landing + whitepaper · deploy/ · scripts/sync-deploy.sh</text>
  <text x="1040" y="97" text-anchor="end" font-size="11" fill="#566070">cloneframe.io</text>

  <rect x="40" y="128" width="1020" height="52" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="40" y="142" width="3" height="24" fill="#ff3b30"/>
  <text x="64" y="159" font-size="14" font-weight="700" fill="#ff3b30">modules/</text>
  <text x="200" y="159" font-size="12.5" fill="#c9d1d9">the CLONE FRAME family as git submodules — live pointers at a pinned commit</text>
  <text x="1040" y="159" text-anchor="end" font-size="11" fill="#566070">3 pointers</text>

  <rect x="40" y="190" width="1020" height="52" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="40" y="204" width="3" height="24" fill="#ff3b30"/>
  <text x="64" y="221" font-size="14" font-weight="700" fill="#ff3b30">frames/</text>
  <text x="200" y="221" font-size="12.5" fill="#c9d1d9">UI drafts as .widget files — iCLONE FRAME · PLAZA FRAME · SKILL FRAME</text>
  <text x="1040" y="221" text-anchor="end" font-size="11" fill="#566070">drafts</text>

  <rect x="40" y="252" width="1020" height="52" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="40" y="266" width="3" height="24" fill="#ff3b30"/>
  <text x="64" y="283" font-size="14" font-weight="700" fill="#ff3b30">mockups/</text>
  <text x="200" y="283" font-size="12.5" fill="#c9d1d9">platform mockups — clone-frame-v3n · virtuals-100-agent-fleet</text>
  <text x="1040" y="283" text-anchor="end" font-size="11" fill="#566070">html</text>

  <rect x="40" y="314" width="1020" height="52" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="40" y="328" width="3" height="24" fill="#ff3b30"/>
  <text x="64" y="345" font-size="14" font-weight="700" fill="#ff3b30">docs/</text>
  <text x="200" y="345" font-size="12.5" fill="#c9d1d9">ARCHITECTURE.md · QUANTUM.md · TRUSTLESS_AGENTS.md · diagrams/</text>
  <text x="1040" y="345" text-anchor="end" font-size="11" fill="#566070">docs</text>

  <text x="40" y="400" font-size="12" fill="#8b949e">inside modules/ — three repositories, fetched with git submodule update --init</text>

  <rect x="40" y="414" width="331" height="82" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="58" y="440" font-size="12.5" font-weight="700" fill="#ff3b30">cloneframe_app_executable</text>
  <text x="58" y="462" font-size="11.5" fill="#c9d1d9">the CLONE FRAME HUB desktop app</text>
  <text x="58" y="481" font-size="11.5" fill="#8b949e">index.html + Node bridge</text>
  <text x="353" y="440" text-anchor="end" font-size="10.5" fill="#566070">public · MIT</text>

  <rect x="384" y="414" width="331" height="82" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="402" y="440" font-size="12.5" font-weight="700" fill="#b18bf5">iIrysframe</text>
  <text x="402" y="462" font-size="11.5" fill="#c9d1d9">iIrys Frame — permanent NFT</text>
  <text x="402" y="481" font-size="11.5" fill="#8b949e">layer vault on Irys × Base</text>
  <text x="697" y="440" text-anchor="end" font-size="10.5" fill="#566070">public · MIT</text>

  <rect x="728" y="414" width="331" height="82" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="746" y="440" font-size="12.5" font-weight="700" fill="#8b949e">roadmap.rd</text>
  <text x="746" y="462" font-size="11.5" fill="#c9d1d9">roadmap and planning notes</text>
  <text x="746" y="481" font-size="11.5" fill="#8b949e">access required</text>
  <text x="1041" y="440" text-anchor="end" font-size="10.5" fill="#566070">private</text>

  <text x="550" y="526" text-anchor="middle" font-size="13" fill="#8b949e">one repo to read the whole platform from — the code itself stays in its own repos</text>
</svg>
