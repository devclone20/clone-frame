<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" role="img" aria-label="CLONE FRAME — the platform monorepo">
  <defs>
    <linearGradient id="accentline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="420" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1397" height="417" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="412" width="1400" height="4" fill="url(#accentline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>
  <g fill="none" stroke="#ff3b30" stroke-linejoin="round">
    <path d="M104 32 111 18 118 32 Z" stroke-width="2"/>
    <path d="M108.2 29.5 111 23.9 113.8 29.5 Z" stroke-width="1.4"/>
  </g>
  <text x="700" y="31" text-anchor="middle" font-size="13" fill="#8b949e">the platform monorepo — site, whitepaper, frames and the family as submodules</text>

  <text x="62" y="146" font-size="72" font-weight="700" letter-spacing="2" fill="#e6edf3">CLONE <tspan fill="#ff3b30">FRAME</tspan></text>
  <rect x="64" y="166" width="300" height="2" fill="url(#rule)"/>

  <text x="64" y="200" font-size="15" fill="#8b949e">AI-agent NFTs and skills, built within Virtuals Protocol</text>
  <text x="64" y="230" font-size="13" fill="#c9d1d9">The public monorepo: the cloneframe.io site and whitepaper,</text>
  <text x="64" y="252" font-size="13" fill="#c9d1d9">the three frames, and the family linked as git submodules.</text>

  <g>
    <rect x="62" y="282" width="88" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="106" y="302" text-anchor="middle" font-size="12" fill="#c9d1d9">public</text>
    <rect x="158" y="282" width="76" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="196" y="302" text-anchor="middle" font-size="12" fill="#c9d1d9">HTML</text>
    <rect x="242" y="282" width="118" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="301" y="302" text-anchor="middle" font-size="11" fill="#ff3b30">Robinhood · Base</text>
    <rect x="368" y="282" width="76" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="406" y="302" text-anchor="middle" font-size="12" fill="#b18bf5">Irys</text>
    <rect x="452" y="282" width="140" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="522" y="302" text-anchor="middle" font-size="12" fill="#c9d1d9">3 submodules</text>
  </g>

  <rect x="760" y="76" width="576" height="248" rx="12" fill="#161b22" stroke="#30363d"/>
  <rect x="760" y="88" width="3" height="224" fill="#ff3b30" opacity="0.8"/>
  <text x="786" y="106" font-size="11" fill="#566070" letter-spacing="1.4">REPO MAP</text>
  <line x1="786" y1="120" x2="1312" y2="120" stroke="#30363d"/>

  <text x="786" y="150" font-size="13" fill="#ff3b30">site/</text>
  <text x="906" y="150" font-size="12.5" fill="#c9d1d9">cloneframe.html — landing + whitepaper</text>
  <text x="786" y="184" font-size="13" fill="#ff3b30">modules/</text>
  <text x="906" y="184" font-size="12.5" fill="#c9d1d9">the family, as live submodule pointers</text>
  <text x="786" y="218" font-size="13" fill="#ff3b30">frames/</text>
  <text x="906" y="218" font-size="12.5" fill="#c9d1d9">iCLONE · PLAZA · SKILL widget drafts</text>
  <text x="786" y="252" font-size="13" fill="#ff3b30">mockups/</text>
  <text x="906" y="252" font-size="12.5" fill="#c9d1d9">HTML mockups of the platform</text>
  <text x="786" y="286" font-size="13" fill="#ff3b30">docs/</text>
  <text x="906" y="286" font-size="12.5" fill="#c9d1d9">architecture, quantum, trustless agents</text>

  <text x="700" y="366" text-anchor="middle" font-size="13" fill="#8b949e">the HUB runs on your own machine — nothing goes to the cloud unless you point it there</text>
</svg>
